name: nightly parity

on:
  schedule:
    # 04:17 UTC daily — off the hour so we don't race the rest of the world.
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    # Real checkpoints: give the download + wasm inference room to breathe.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm ci: parity numbers depend on the locked ORT/transformers versions.
      # The providers onnxruntime-node would fetch from NuGet are CUDA/TensorRT
      # libs this CPU-only job never loads; skip that download.
      - run: npm ci --no-audit --no-fund
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      # One real example per family, real pinned weights, probabilities
      # compared to parity/baselines.json. Families without a baseline skip;
      # a drift exits 1. strands-decider's 1.8 GB q8 export runs through the
      # locked native onnxruntime-node — see scripts/parity-nightly.mjs.
      - run: npm run parity
